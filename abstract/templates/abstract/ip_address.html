{% load i18n %}
{% if not known %}
  {{ address }}
{% else %}
  <button
    type="button"
    class="link cursor-pointer font-mono"
    data-dialog="ip-{{ token }}"
    aria-haspopup="dialog"
  >
    {{ address }}
  </button>
  <dialog
    id="ip-{{ token }}"
    class="drawer"
    data-side="right"
    data-backdrop-close
    aria-label="{{ address }}"
  >
    <article class="w-full max-w-md bg-card p-0 before:hidden sm:w-2/3">
      <network-location
        class="block [&_.card]:rounded-none [&_.card]:[box-shadow:none]"
        address="{{ address }}"
        map
        data-map='{% translate "map"|capfirst %}'
        data-unavailable='{% translate "location unavailable" %}'
        data-retry='{% translate "retry"|capfirst %}'
      ></network-location>
    </article>
  </dialog>
{% endif %}
