{% load abstract i18n %}
{% if not known %}
  {{ address }}
{% else %}
  <button
    type="button"
    class="link cursor-pointer font-mono"
    data-dialog="ip-{{ token }}"
    aria-haspopup="dialog"
  >
    {{ address }}
  </button>
  <dialog
    id="ip-{{ token }}"
    class="drawer"
    data-side="right"
    data-backdrop-close
    aria-labelledby="ip-title-{{ token }}"
  >
    <article class="w-full max-w-md sm:w-2/3">
      <header class="flex-row items-start justify-between gap-4">
        <h2
          id="ip-title-{{ token }}"
          class="text-lg font-semibold leading-none tracking-tight break-all font-mono"
        >
          {{ address }}
        </h2>
        <button
          type="button"
          class="btn shrink-0"
          data-variant="ghost"
          data-size="icon-sm"
          data-dialog-close
          aria-label='{% translate "close"|capfirst %}'
        >
          {% tabler name="x" size="4" %}
        </button>
      </header>
      <section class="px-4 pb-4">
        <network-location
          address="{{ address }}"
          map
          hide-address
          data-map='{% translate "map"|capfirst %}'
          data-unavailable='{% translate "location unavailable" %}'
          data-retry='{% translate "retry"|capfirst %}'
        ></network-location>
      </section>
    </article>
  </dialog>
{% endif %}
