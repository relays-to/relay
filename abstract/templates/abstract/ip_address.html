{% load abstract i18n %}
{% if not known %}
  {{ address }}
{% else %}
  <button
    type="button"
    class="badge font-mono"
    data-size="sm"
    data-variant="outline"
    data-dialog="ip-{{ token }}"
    aria-haspopup="dialog"
  >
    {{ address }}
  </button>
  <dialog
    id="ip-{{ token }}"
    class="drawer"
    data-side="right"
    data-backdrop-close
    aria-labelledby="ip-title-{{ token }}"
  >
    <article class="w-full max-w-md sm:w-2/3">
      <header class="flex-row items-start justify-between gap-4">
        <h2
          id="ip-title-{{ token }}"
          class="text-lg font-semibold leading-none tracking-tight break-all font-mono"
        >
          {{ address }}
        </h2>
        <button
          type="button"
          class="btn shrink-0"
          data-variant="ghost"
          data-size="icon-sm"
          data-dialog-close
          aria-label='{% translate "close"|capfirst %}'
        >
          {% tabler name="x" size="4" %}
        </button>
      </header>
      <section class="flex flex-col gap-6 px-4 pb-4">
        <dl class="m-0 grid grid-cols-[auto_1fr] items-baseline gap-x-4 gap-y-2 text-sm">
          <dt class="text-muted-foreground">{% translate "protocol"|capfirst %}</dt>
          <dd class="m-0">IPv{{ version }}</dd>
          <dt class="text-muted-foreground">{% translate "scope"|capfirst %}</dt>
          <dd class="m-0">{{ scope }}</dd>
          <dt class="text-muted-foreground">{% translate "reverse name"|capfirst %}</dt>
          <dd class="m-0 break-all"><code>{{ reverse_pointer }}</code></dd>
        </dl>
      </section>
    </article>
  </dialog>
{% endif %}
